<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <title>Verifiction de mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="">
            <label>Utilisateur</label>
            <input type="text" required>
            <label>Mot de passe</label>
            <input type="password" id="psw" required><i class="fa-regular fa-eye-slash"></i>
            <input type="button" value="Envoyé">
        </form>
    </div>

    <div id="message">
        <h3>Le mot de passe doit contenir le élements suivants</h3>
        <p id="letter" class="invalid">Une lettre miniscule</p>
        <p id="capital" class="invalid">Une lettre majuscule</p>
        <p id="number" class="invalid">Un chiffre</p>
        <p id="lenght" class="invalid">8 caractères minimum</p>
    </div>


     <script src="script.js"></script>
</body>
</html>
